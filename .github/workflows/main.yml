name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Build & push Docker image (explicit context)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/containerized-flask-app:latest

      # 4️⃣ Verify health (HOST 5001 → CONTAINER 8081)
      - name: Verify health
        run: |
          docker run -d \
            -e APP_PORT=8081 \
            -p 5001:8081 \
            ${{ secrets.DOCKERHUB_USERNAME }}/containerized-flask-app:latest
          sleep 5
          curl http://localhost:5001/health
